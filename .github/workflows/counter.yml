name : Publish App

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    hola:
        runs-on: ubuntu-latest
        steps: 
            - name: descargar codigo
              uses: actions/checkout@v3
            - name: instalar node
              uses: actions/setup-node@v3

            - name: node version
              run: node --version

            - name: verify npm
              run: npm --version

            - name: clean install
              run: npm ci

            - name: find proyect
              run: cd clase18/contador

            - name: where am i
              run: pwd

            - name: building
              run: npx vite build

            - name: Save zip
              uses: actions/upload-artifact@v4
              with:
                name: web-application
                path: ./dist 
