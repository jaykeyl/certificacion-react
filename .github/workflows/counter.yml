name : Publish App

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    hola:
        runs-on: ubuntu-latest
        steps: 
            - name: descargar codigo
              uses: actions/checkout@v3
            - name: instalar node
              uses: actions/setup-node@v3

            - name: node version
              run: node --version

            - name: verify npm
              run: npm --version

            - name: Clean install
              working-directory: ./clase18/contador
              run: npm ci

            - name: Where am I
              working-directory: ./clase18/contador
              run: pwd

            - name: Building
              working-directory: ./clase18/contador
              run: npm run build

            - name: Save zip
              uses: actions/upload-artifact@v4
              with:
                name: web-application
                path: ./clase18/contador/dist

